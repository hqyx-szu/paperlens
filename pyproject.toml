[project]
name = "paper-lens"
version = "0.1.0"
description = "PaperLens - RAG paper knowledge base"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncmy>=0.2.17",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "python-dotenv>=1.2.4",
    "alembic>=1.20.1",
    "openai>=3.37.0",
    "pypdf>=6.21.2",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.2.0",
    "numpy>=2.5.4",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "reportlab>=5.1.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
extend-exclude = [".cline", "doc", "var"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
